<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="../../css/font.css" />
  <link rel="stylesheet" type="text/css" href="../../css/reset.css" />
  <link rel="stylesheet" type="text/css" href="../../css/Chart.min.css" />
  <link rel="stylesheet" type="text/css" href="../../css/jquery-ui.min.css" />
  <link rel="stylesheet" type="text/css" href="../../css/jquery-ui-timepicker.css" />
  <link rel="stylesheet" type="text/css" href="../../css/layout.css" />
  <link rel="stylesheet" type="text/css" href="../../css/style.css" />
  <title>쿠폰 등록</title>
</head>
<body>
<div class="wrap mcdonald">
  <h3 class="page_title">COUPON</h3>
  <form action="">
    <article class="area option bdr_bottom">
      <section class="breadcrumb">
        <ul>
          <li>
            <a href="javascript:void(0)">홈</a>
          </li>
          <li>
            <span>쿠폰 등록</span>
          </li>
        </ul>
      </section>
    </article>
    <article class="area option bdr_bottom regist">
      <section class="input_field">
        <h6 class="title">쿠폰명</h6>
        <input type="text" name="" placeholder="쿠폰명을 입력해주세요." />
      </section>
      <section class="select-box">
        <select name="" id="">
          <option value="">맥도날드 앱</option>
          <option value="">플러스 앱</option>
          <option value="">기타</option>
        </select>
      </section>
    </article>
    <article class="area form_field">
      <section class="left">
        <ul class="input_field">
          <li>
            <h6 class="label_name">이미지 등록</h6>
            <article class="components file">
              <section class="value">
                <span>이미지를 등록해주세요.</span>
                <button type="button" class="btn del" onclick="delImage(this)"></button>
              </section>
              <label class="file label">
                <input type="file" name="" accept="image/*" onchange="loadImage(this)" />
                <span class="btn file">선택</span>
              </label>
            </article>
          </li>
          <li>
            <h6 class="label_name">쿠폰 링크</h6>
            <article class="components al_center">
              <input type="text" name="" id="" placeholder="URL" />
              <button type="button" class="btn insert">삽입</button>
            </article>
          </li>
        </ul>
        <ul class="input_field text">
          <li>
            <h6 class="label_name">Title</h6>
            <article class="components">
              <textarea name="" id="" cols="30" rows="10" placeholder="Title을 입력해주세요."></textarea>
              <section class="text_cnt"><span class="current">0</span>&#47;200<i>자</i></section>
            </article>
          </li>
          <li>
            <h6 class="label_name">Description</h6>
            <article class="components">
              <textarea name="" id="" cols="30" rows="10" placeholder="Description을 입력해주세요."></textarea>
              <section class="text_cnt"><span class="current">0</span>&#47;500<i>자</i></section>
            </article>
          </li>
          <li>
            <h6 class="label_name">Temps & Condition</h6>
            <article class="components">
              <textarea name="" id="" cols="30" rows="10" placeholder="Temps & Condition을 입력해주세요."></textarea>
              <section class="text_cnt"><span class="current">0</span>&#47;4,000<i>자</i></section>
            </article>
          </li>
        </ul>
        <ul class="input_field period">
          <li>
            <article class="part">
              <h6 class="label_name">Expiry Date</h6>
              <section class="components">
                <input type="text" name="" class="datepicker" placeholder="0000-00-00" />
                <button type="button" class="btn calendar"></button>
              </section>
            </article>
            <article class="part">
              <h6 class="label_name">Expiry Time</h6>
              <section class="components">
                <input type="text" name="" class="timepicker" placeholder="00:00" />
                <button type="button" class="btn time"></button>
              </section>
            </article>
          </li>
          <li>
            <article class="part">
              <h6 class="label_name">Daily Start Time</h6>
              <section class="components">
                <input type="text" name="" class="timepicker" placeholder="00:00" />
                <button type="button" class="btn time"></button>
              </section>
            </article>
            <article class="part">
              <h6 class="label_name">Daily End Time</h6>
              <section class="components">
                <input type="text" name="" class="timepicker" placeholder="00:00" />
                <button type="button" class="btn time"></button>
              </section>
            </article>
          </li>
        </ul>
      </section>
      <section class="right">
        <article class="preview">
          <section class="image">
            <img src="../../image/mcdonalds/noimage.png" alt="이미지 없음" class="noimage" />
          </section>
          <section class="contents">
            <textarea name="" id="" cols="30" rows="10" readonly placeholder="문자 메시지 내용과 쿠폰 링크를 삽입해주세요."></textarea>
          </section>
        </article>
      </section>
    </article>
    <article class="area button">
      <button type="button" class="btn regist">쿠폰 등록</button>
    </article>
  </form>
  <footer class="footer">
    <p class="copyright">ⓒ Milvus Corp.</p>
  </footer>
  <script type="text/javascript" charset="utf-8" src="../../js/jquery-3.6.0.min.js"></script>
  <script type="text/javascript" charset="utf-8" src="../../js/jquery-ui.min.js"></script>
  <script type="text/javascript" charset="utf-8" src="../../js/jquery-ui-timepicker.js"></script>
  <script type="text/javascript" charset="utf-8" src="../../js/mcdonalds_coupon.js"></script>
</div>
</body>
</html>
