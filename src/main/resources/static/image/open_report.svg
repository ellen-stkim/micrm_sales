<text transform="matrix(1 0 0 1 658.3955 234.333)"><tspan x="0" y="0" class="st0 st11 st17">상세 데이터에서 특정 값 클릭 시 </tspan><tspan x="-5.2" y="11" class="st0 st11 st17">분석 테이블에 추가적으로 조건 적용</tspan><tspan x="16.4" y="22" class="st0 st11 st17">(다시 클릭 시 필터 해제)</tspan></text>
